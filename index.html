<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Bug Tracker" />
  <meta name="theme-color" content="#0d1117" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <title>Stevo Bug Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Header -->
  <header class="topbar">
    <div class="topbar-left">
      <h1>Stevo Bug Tracker</h1>
      <p class="subtitle" id="syncStatus">Connecting…</p>
    </div>
    <div class="topbar-right">
      <span id="userLabel" class="user-label"></span>
      <button id="signOutBtn" class="btn btn-outline">Sign Out</button>
    </div>
  </header>

  <!-- Add Bug form -->
  <div class="form-bar" id="formBar">
    <button type="button" class="form-bar-header" id="formToggle">
      <span class="form-bar-title">Report a Bug</span>
      <span class="form-toggle-icon">&#9662;</span>
    </button>
    <div class="form-row">
      <input id="bugTitle" type="text" placeholder="Bug title" class="form-input flex-3" />
      <select id="bugCategory" class="form-select">
        <option value="">No Category</option>
        <option value="Home">Home</option>
        <option value="Social">Social</option>
        <option value="Bets">Bets</option>
        <option value="Live Games">Live Games</option>
        <option value="Profile">Profile</option>
        <option value="Settings">Settings</option>
        <option value="Notifications">Notifications</option>
        <option value="Navigation">Navigation</option>
        <option value="Auth/Login">Auth/Login</option>
        <option value="Other">Other</option>
      </select>
      <select id="bugSeverity" class="form-select">
        <option value="Critical">Critical</option>
        <option value="High">High</option>
        <option value="Medium" selected>Medium</option>
        <option value="Low">Low</option>
      </select>
      <select id="bugAssignedTo" class="form-select">
        <option value="">Unassigned</option>
      </select>
      <select id="bugStatus" class="form-select">
        <option value="open">Bugs</option>
        <option value="features-open">Features</option>
        <option value="questions">Questions</option>
        <option value="in-progress">In Progress</option>
        <option value="in-review">Review</option>
        <option value="closed">Closed</option>
      </select>
      <button id="addBugBtn" class="btn btn-primary">Add Bug</button>
    </div>
    <div class="form-attach-row">
      <label class="btn btn-outline attach-label">
        &#128247; Add screenshots
        <input id="newBugAttachmentInput" type="file" accept="image/*" multiple style="display:none" />
      </label>
      <button type="button" id="newBugPasteBtn" class="btn btn-outline attach-label">&#128203; Paste</button>
      <span class="attachments-hint" id="newBugAttachHint">from Photos, or paste a copied screenshot</span>
      <div id="newBugAttachmentsList" class="attachments-list"></div>
    </div>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <input id="searchInput" type="text" placeholder="Search bugs…" class="form-input search-input" />
    <select id="severityFilter" class="form-select">
      <option value="">All Severities</option>
      <option value="Critical">Critical</option>
      <option value="High">High</option>
      <option value="Medium">Medium</option>
      <option value="Low">Low</option>
    </select>
    <select id="categoryFilter" class="form-select">
      <option value="">All Categories</option>
      <option value="Home">Home</option>
      <option value="Social">Social</option>
      <option value="Bets">Bets</option>
      <option value="Live Games">Live Games</option>
      <option value="Profile">Profile</option>
      <option value="Settings">Settings</option>
      <option value="Notifications">Notifications</option>
      <option value="Navigation">Navigation</option>
      <option value="Auth/Login">Auth/Login</option>
      <option value="Other">Other</option>
    </select>
    <select id="assigneeFilter" class="form-select">
      <option value="">All Assignees</option>
    </select>
    <div class="stats-inline">
      <span class="stat-chip"><span class="stat-chip-label">Total</span> <span class="stat-chip-value" id="statTotal">0</span></span>
      <span class="stat-chip"><span class="stat-chip-label">Bugs</span> <span class="stat-chip-value" id="statOpen">0</span></span>
      <span class="stat-chip"><span class="stat-chip-label">Features</span> <span class="stat-chip-value" id="statFeaturesOpen">0</span></span>
      <span class="stat-chip"><span class="stat-chip-label">Questions</span> <span class="stat-chip-value" id="statQuestions">0</span></span>
      <span class="stat-chip"><span class="stat-chip-label">In Progress</span> <span class="stat-chip-value" id="statInProgress">0</span></span>
      <span class="stat-chip"><span class="stat-chip-label">Closed</span> <span class="stat-chip-value" id="statClosed">0</span></span>
    </div>
  </div>

  <!-- Mobile status tabs -->
  <nav class="mobile-tabs" id="mobileTabs">
    <button class="mobile-tab active" data-status="open">Bugs <span class="tab-count" id="tab-count-open">0</span></button>
    <button class="mobile-tab" data-status="features-open">Features <span class="tab-count" id="tab-count-features-open">0</span></button>
    <button class="mobile-tab" data-status="questions">Questions <span class="tab-count" id="tab-count-questions">0</span></button>
    <button class="mobile-tab" data-status="in-progress">In Progress <span class="tab-count" id="tab-count-in-progress">0</span></button>
    <button class="mobile-tab" data-status="in-review">Review <span class="tab-count" id="tab-count-in-review">0</span></button>
    <button class="mobile-tab" data-status="closed">Closed <span class="tab-count" id="tab-count-closed">0</span></button>
  </nav>

  <!-- Board columns -->
  <main class="board" id="board">
    <div class="column mobile-active" data-status="open">
      <div class="column-header">
        <span class="column-title">Bugs</span>
        <span class="count" id="count-open">0</span>
      </div>
      <div class="column-body" id="col-open"></div>
    </div>
    <div class="column" data-status="features-open">
      <div class="column-header">
        <span class="column-title">Features</span>
        <span class="count" id="count-features-open">0</span>
      </div>
      <div class="column-body" id="col-features-open"></div>
    </div>
    <div class="column" data-status="questions">
      <div class="column-header">
        <span class="column-title">Questions</span>
        <span class="count" id="count-questions">0</span>
      </div>
      <div class="column-body" id="col-questions"></div>
    </div>
    <div class="column" data-status="in-progress">
      <div class="column-header">
        <span class="column-title">In Progress</span>
        <span class="count" id="count-in-progress">0</span>
      </div>
      <div class="column-body" id="col-in-progress"></div>
    </div>
    <div class="column" data-status="in-review">
      <div class="column-header">
        <span class="column-title">Review</span>
        <span class="count" id="count-in-review">0</span>
      </div>
      <div class="column-body" id="col-in-review"></div>
    </div>
    <div class="column" data-status="closed">
      <div class="column-header">
        <span class="column-title">Closed</span>
        <span class="count" id="count-closed">0</span>
      </div>
      <div class="column-body" id="col-closed"></div>
    </div>
  </main>

  <!-- Edit Bug Modal -->
  <div class="modal-backdrop" id="editModalBackdrop">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="editModalTitle">
      <div class="modal-header">
        <h2 id="editModalTitle">Edit Bug</h2>
        <button class="modal-close" id="editModalCloseBtn">&times;</button>
      </div>
      <div class="form-grid">
        <div class="field field-wide">
          <label for="editTitle">Bug title *</label>
          <input id="editTitle" type="text" />
        </div>
        <div class="field">
          <label for="editCategory">Category</label>
          <select id="editCategory">
            <option value="">No Category</option>
            <option value="Home">Home</option>
            <option value="Social">Social</option>
            <option value="Bets">Bets</option>
            <option value="Live Games">Live Games</option>
            <option value="Profile">Profile</option>
            <option value="Settings">Settings</option>
            <option value="Notifications">Notifications</option>
            <option value="Navigation">Navigation</option>
            <option value="Auth/Login">Auth/Login</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="field">
          <label for="editSeverity">Severity</label>
          <select id="editSeverity">
            <option value="Critical">Critical</option>
            <option value="High">High</option>
            <option value="Medium">Medium</option>
            <option value="Low">Low</option>
          </select>
        </div>
        <div class="field">
          <label for="editLoe">LOE (effort)</label>
          <select id="editLoe">
            <option value="">Not set</option>
            <option value="High">High</option>
            <option value="Medium">Medium</option>
            <option value="Low">Low</option>
          </select>
        </div>
        <div class="field">
          <label for="editStatus">Status</label>
          <select id="editStatus">
            <option value="open">Bugs</option>
            <option value="features-open">Features</option>
            <option value="questions">Questions</option>
            <option value="in-progress">In Progress</option>
            <option value="in-review">Review</option>
            <option value="closed">Closed</option>
          </select>
        </div>
        <div class="field">
          <label for="editAssignedTo">Assigned To</label>
          <select id="editAssignedTo">
            <option value="">Unassigned</option>
          </select>
        </div>
        <div class="field">
          <label for="editReporter">Reporter</label>
          <input id="editReporter" type="text" placeholder="Who reported this?" />
        </div>
        <div class="field field-wide">
          <label for="editSteps">Steps to Reproduce</label>
          <textarea id="editSteps" rows="4" placeholder="1. Go to…&#10;2. Click…&#10;3. Observe…"></textarea>
        </div>
        <div class="field field-wide">
          <label for="editNotes">Notes</label>
          <textarea id="editNotes" rows="3" placeholder="Additional context, links, screenshots… (paste images here)"></textarea>
        </div>
        <div class="field field-wide">
          <label for="editQuestion">Question</label>
          <textarea id="editQuestion" rows="2" placeholder="What needs answering? (shown in the Questions column)"></textarea>
        </div>
        <div class="field field-wide">
          <label for="editAnswer">Answer</label>
          <textarea id="editAnswer" rows="2" placeholder="The answer"></textarea>
        </div>
        <div class="field field-wide">
          <label for="editWhatWasDone">What was done</label>
          <textarea id="editWhatWasDone" rows="3" placeholder="Describe the work (shown in Review)"></textarea>
        </div>
        <div class="field field-wide">
          <label for="editHowToTest">How to test</label>
          <textarea id="editHowToTest" rows="3" placeholder="1. Go to…&#10;2. Verify…"></textarea>
        </div>
        <div class="field field-wide">
          <label for="editFeedback">Feedback</label>
          <textarea id="editFeedback" rows="2" placeholder="What needs to be different (when sending back from Review)"></textarea>
        </div>
        <div class="field field-wide">
          <label>Screenshots / Attachments</label>
          <div class="attachments-controls">
            <input id="editAttachmentInput" type="file" accept="image/*" multiple />
            <button type="button" id="editPasteBtn" class="btn btn-outline">&#128203; Paste</button>
          </div>
          <div id="editAttachmentsList" class="attachments-list"></div>
        </div>
      </div>
      <div class="form-actions">
        <button id="editCancelBtn" class="btn btn-outline">Cancel</button>
        <button id="editSaveBtn" class="btn btn-primary">Save Changes</button>
      </div>
    </div>
  </div>

  <!-- Login overlay -->
  <div id="loginOverlay">
    <div id="loginCard">
      <h2>Stevo Bug Tracker</h2>
      <p id="loginError" class="login-error" style="display:none"></p>
      <div class="login-field">
        <label for="loginEmail">Email</label>
        <input id="loginEmail" type="email" autocomplete="email" placeholder="you@example.com" />
      </div>
      <div class="login-field">
        <label for="loginPassword">Password</label>
        <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Password" />
      </div>
      <button id="loginBtn" class="btn btn-primary" style="width:100%">Sign In</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
